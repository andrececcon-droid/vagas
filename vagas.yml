name: Buscar vagas
on:
  schedule:
    - cron: "7 10,15,19 * * *"   # 07h07, 12h07 e 16h07 no horário de Brasília
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: buscar-vagas
  cancel-in-progress: false
jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 playwright && playwright install --with-deps chromium
      - run: python buscar_vagas.py
      - run: |
          git config user.name "bot-vagas"
          git config user.email "bot-vagas@users.noreply.github.com"
          git add -A
          git commit -m "Atualização automática" || echo "sem mudanças"
          git pull --rebase
          git push
